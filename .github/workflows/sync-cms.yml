name: Sync Pages CMS to Supabase

on:
  push:
    branches: [main]
    paths:
      - "data/**"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      CMS_SYNC_SECRET: ${{ secrets.CMS_SYNC_SECRET }}
    steps:
      - name: Check Supabase configuration
        id: config
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$CMS_SYNC_SECRET" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Supabase sync skipped until repository secrets are configured."
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
      - name: Send CMS data to TPLabs ContentOps
        if: steps.config.outputs.ready == 'true'
        run: |
          jq -n \
            --slurpfile site data/site.json \
            --slurpfile channels data/channels.json \
            --slurpfile content data/content.json \
            --slurpfile automations data/automations.json \
            '{site:$site[0],channels:$channels[0],content:$content[0],automations:$automations[0]}' > payload.json
          curl --fail-with-body \
            -H "Content-Type: application/json" \
            -H "x-cms-sync-secret: $CMS_SYNC_SECRET" \
            --data-binary @payload.json \
            "$SUPABASE_URL/functions/v1/sync-cms"
