<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11182b" />
    <meta name="description" content="TPLabs ContentOps — quản lý nội dung, lịch đăng, kênh, đội ngũ và hiệu suất tại một nơi." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2311182b'/%3E%3Cpath d='M17 42V22h9l6 10 6-10h9v20h-8V34l-7 10-7-10v8z' fill='%23ff6b6b'/%3E%3C/svg%3E" />
    <title>TPLabs ContentOps</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-locked">
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <span class="brand-mark">C</span>
          <div><strong>TPLabs</strong><span>ContentOps Hub</span></div>
        </div>
        <button class="mobile-close" id="mobileClose" aria-label="Đóng menu">×</button>
        <nav id="mainNav" aria-label="Điều hướng chính"></nav>
        <div class="sidebar-foot">
          <div class="workspace-card">
            <span class="workspace-avatar">TP</span>
            <div><strong>TPLabs</strong><small>Private workspace</small></div>
            <span class="chevron">⌄</span>
          </div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Mở menu">☰</button>
          <div class="search-wrap">
            <span>⌕</span>
            <input id="globalSearch" type="search" placeholder="Tìm nội dung, kênh hoặc thành viên…" aria-label="Tìm kiếm" />
            <kbd>⌘ K</kbd>
          </div>
          <div class="top-actions">
            <span class="mode-badge" id="modeBadge">Private</span>
            <button class="icon-btn" id="notificationButton" aria-label="Thông báo">♢<span class="notification-dot"></span></button>
            <button class="profile-button" id="profileButton"><span>TP</span><div><strong>TPLabs</strong><small>Private</small></div></button>
          </div>
        </header>

        <section class="page" id="page" aria-live="polite"></section>
      </main>
    </div>

    <div class="toast-stack" id="toastStack" aria-live="polite"></div>

    <dialog id="appDialog">
      <form method="dialog" id="dialogForm">
        <div class="dialog-head"><div><span class="eyebrow" id="dialogEyebrow">CONTENT</span><h2 id="dialogTitle">Thêm nội dung</h2></div><button type="button" class="dialog-close" aria-label="Đóng">×</button></div>
        <div id="dialogBody" class="dialog-body"></div>
        <div class="dialog-actions"><button type="button" class="button secondary dialog-cancel">Hủy</button><button type="submit" class="button primary" id="dialogSubmit">Lưu thay đổi</button></div>
      </form>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
