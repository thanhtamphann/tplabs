media:
  input: public-media
  output: /public-media

# Pages CMS chỉ quản lý thông tin công khai của giao diện.
# Nội dung, kênh, thành viên và số liệu riêng tư luôn nằm trong Supabase có RLS.
content:
  - name: workspace
    label: Public site settings
    type: file
    path: data/site.json
    format: json
    fields:
      - name: workspaceName
        label: Workspace name
        type: string
        required: true
      - name: description
        label: Public description
        type: text
      - name: timezone
        label: Timezone
        type: select
        options:
          values:
            - value: Asia/Ho_Chi_Minh
              label: Vietnam (GMT+7)
            - value: UTC
              label: UTC
      - name: language
        label: Language
        type: select
        options:
          values:
            - value: vi
              label: Vietnamese
            - value: en
              label: English

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      update: "site(update): {path}"

actions:
  - name: deploy-site
    label: Deploy website
    workflow: pages.yml
